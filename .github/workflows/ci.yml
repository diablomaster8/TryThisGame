# TECH-10: checks for every pull request and every branch push other than main (main runs
# the same checks in deploy.yml before it deploys).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-types-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx tsx tests/tools/content-check.ts

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  # TECH-45: the sim reads no time zone, so its suite must pass outside UTC too.
  test-tokyo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/sim
        env:
          TZ: Asia/Tokyo

  # HOT-CI: the sim's wall-clock budgets, alone and one file at a time, at the CI scale
  # (TIMING_BUDGET in src/config/tuning-sim.ts). The main suite skips those asserts on CI,
  # where parallel workers swamp them; this job reports a real slowdown without blocking.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --no-file-parallelism tests/sim/world.test.ts tests/sim/lifecycle.test.ts tests/sim/offline.test.ts tests/sim/battle-balance.test.ts tests/sim/battle-resume.test.ts tests/sim/pond-glide.test.ts tests/sim/story-book.test.ts tests/sim/battle-round3.test.ts tests/sim/battle-atb.test.ts tests/render/hollow-automap.test.ts tests/sim/dungeon-r8-deep-perf.test.ts tests/sim/dungeon-v3.test.ts tests/sim/tactics-ai.test.ts tests/sim/tactics-core.test.ts tests/sim/nav.test.ts
        env:
          PERF: 1

  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle
