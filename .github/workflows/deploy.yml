name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Test-speed: the checks run as parallel jobs, and deploy waits for all of them. The unit
  # tests are split into four shards (npx vitest run --shard=N/4, files spread by path hash).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # TECH-10: content problems block a deploy.
      - run: npx tsx tests/tools/content-check.ts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A hang must not take the job to its six-hour limit: the step times out, and the next step
      # reports the files still running (tests/tools/running-reporter.mjs).
      - run: npx vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --reporter=./tests/tools/running-reporter.mjs --outputFile.json=vitest-report.json
        timeout-minutes: 8
      # The slowest files and any failed files, as run annotations (tests/tools/slow-report.cjs).
      - if: always()
        run: node tests/tools/slow-report.cjs vitest-report.json 6 shard-${{ matrix.shard }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project sites are served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      # TECH-41: and so does a bundle over budget.
      - run: npm run check:bundle
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # HOT-CI: the sim's wall-clock budgets, alone and one file at a time, at the CI scale
  # (TIMING_BUDGET in src/config/tuning-sim.ts). The main suite skips those asserts on CI,
  # where parallel workers swamp them; this job reports a real slowdown without blocking.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --no-file-parallelism tests/sim/world.test.ts tests/sim/lifecycle.test.ts tests/sim/offline.test.ts tests/sim/battle-balance.test.ts tests/sim/battle-resume.test.ts tests/sim/pond-glide.test.ts tests/sim/story-book.test.ts tests/sim/battle-round3.test.ts tests/sim/battle-atb.test.ts tests/render/hollow-automap.test.ts tests/sim/dungeon-r8-deep-perf.test.ts tests/sim/dungeon-v3.test.ts tests/sim/tactics-ai.test.ts tests/sim/tactics-core.test.ts tests/sim/nav.test.ts
        env:
          PERF: 1

  deploy:
    needs: [check, test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
