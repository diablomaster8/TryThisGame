name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A running deploy always finishes; newer pushes queue behind it (a push used to cancel it, and
  # with a 10+ minute build nothing ever deployed).
  cancel-in-progress: false

jobs:
  # Test-speed: the checks run as parallel jobs, and deploy waits for all of them. The unit
  # tests are split into six shards (npx vitest run --shard=N/6, files dealt out by weight, see tests/shard-weights.ts).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Efficiency (2026-11-07): node_modules comes back whole while package-lock.json is
      # unchanged, so npm ci (27-45 s in every job) only runs on a cache miss.
      - id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      # ESLint's content cache carries over between runs (the newest run's copy is restored).
      - uses: actions/cache@v4
        with:
          path: .cache/eslint
          key: eslint-${{ github.sha }}
          restore-keys: eslint-
      - run: npm run lint
      # TECH-10: content problems block a deploy.
      - run: npx tsx tests/tools/content-check.ts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Efficiency (2026-11-07): node_modules comes back whole while package-lock.json is
      # unchanged, so npm ci (27-45 s in every job) only runs on a cache miss.
      - id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      # A hang must not take the job to its six-hour limit: the step times out, and the next step
      # reports the files still running (tests/tools/running-reporter.mjs).
      - run: npx vitest run --shard=${{ matrix.shard }}/6 --reporter=default --reporter=json --reporter=./tests/tools/running-reporter.mjs --outputFile.json=vitest-report.json
        timeout-minutes: 8
      # The slowest files and any failed files, as run annotations (tests/tools/slow-report.cjs).
      - if: always()
        run: node tests/tools/slow-report.cjs vitest-report.json 6 shard-${{ matrix.shard }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Efficiency (2026-11-07): node_modules comes back whole while package-lock.json is
      # unchanged, so npm ci (27-45 s in every job) only runs on a cache miss.
      - id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      # tsc's incremental build info (tsconfig `tsBuildInfoFile`) carries over the same way.
      - uses: actions/cache@v4
        with:
          path: .cache/tsc.tsbuildinfo
          key: tsc-${{ github.sha }}
          restore-keys: tsc-
      - run: npm run build
        env:
          # Project sites are served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      # TECH-41: and so does a bundle over budget.
      - run: npm run check:bundle
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # HOT-CI: the sim's wall-clock budgets, alone and one file at a time, at the CI scale
  # (TIMING_BUDGET in src/config/tuning-sim.ts). The main suite skips those asserts on CI,
  # where parallel workers swamp them; this job reports a real slowdown without blocking.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Efficiency (2026-11-07): node_modules comes back whole while package-lock.json is
      # unchanged, so npm ci (27-45 s in every job) only runs on a cache miss.
      - id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - run: npx vitest run --no-file-parallelism tests/sim/world.test.ts tests/sim/lifecycle.test.ts tests/sim/offline.test.ts tests/sim/battle-balance.test.ts tests/sim/battle-resume.test.ts tests/sim/pond-glide.test.ts tests/sim/story-book.test.ts tests/sim/battle-round3.test.ts tests/sim/battle-atb.test.ts tests/render/hollow-automap.test.ts tests/render/frame-budget.test.ts tests/sim/dungeon-r8-deep-perf.test.ts tests/sim/dungeon-v3.test.ts tests/sim/tactics-ai.test.ts tests/sim/tactics-core.test.ts tests/sim/nav.test.ts
        env:
          PERF: 1

  deploy:
    needs: [check, test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
