# TECH-11: the browser smoke run (tests/e2e/run.cjs). Nightly and on demand, so the pull
# request checks in ci.yml stay fast; the headless sim harness (tests/sim/play-harness.test.ts)
# already runs there on every PR.
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright-core@1.49.1
      - run: npx playwright-core install --with-deps chromium
      - run: npx vite preview --port 4173 &
      - run: npx wait-on http://localhost:4173 || sleep 5
      - run: npm run test:e2e
        env:
          E2E_URL: http://localhost:4173
