# TECH-11: the browser smoke run (tests/e2e, @playwright/test). Pull requests run every spec
# except the soak (under 6 minutes); a nightly schedule runs the 10-minute soak on main.
name: E2E

on:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The config builds, then serves `vite preview` on 4173 and waits for it.
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: .cache/e2e-results
          retention-days: 7

  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:soak
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: soak-traces
          path: .cache/e2e-results
          retention-days: 7
